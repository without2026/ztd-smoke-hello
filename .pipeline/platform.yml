# platform.yml — generated by zero-to-deploy skill.
# Per-app configuration consumed by reusable workflows from
# zero-to-deploy-platform v0.1.0-alpha.3.

project_root: app
platform: android-native
display_name: "Hello Android Smoke"

github:
  repo: without2026/ztd-smoke-hello
  base_branch: main

languages:
  native: kotlin

spec:
  dir: .spec
  contracts_profile: client_primary    # fullstack | client_primary | api_only
  comment_patterns:
    kotlin: "// spec:"
  test_file_patterns:
    kotlin:
      - "src/test/**/*.kt"
      - "src/androidTest/**/*.kt"

ci:
  adapter: android
  platform_version: v0.1.0-alpha.3      # pin for caller stubs
  runners:
    primary: ubuntu-latest

build:
  android: gradle

test:
  android_unit: gradle
  android_instrumented: espresso
  a11y: android-lint
