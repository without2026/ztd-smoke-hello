# Do NOT edit manually; re-render via skill to change pin.

name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # contents: write needed for auto-fix to commit+push fixes back to the PR branch.
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  # id-token: write required by claude-code-action (OIDC) inside auto-fix/review.
  id-token: write

jobs:
  tests:
    uses: without2026/zero-to-deploy-platform/.github/workflows/adapter-tests.yml@v0.1.0-alpha.3
    with:
      adapter: android
    secrets: inherit

  gates:
    uses: without2026/zero-to-deploy-platform/.github/workflows/adapter-gates.yml@v0.1.0-alpha.3
    with:
      adapter: android
      platform_ref: v0.1.0-alpha.3
    secrets: inherit

  review:
    needs: [tests, gates]
    uses: without2026/zero-to-deploy-platform/.github/workflows/ci-review.yml@v0.1.0-alpha.3
    secrets: inherit

  auto-fix:
    needs: [tests, gates, review]
    if: ${{ failure() }}
    uses: without2026/zero-to-deploy-platform/.github/workflows/ci-auto-fix.yml@v0.1.0-alpha.3
    with:
      platform_ref: v0.1.0-alpha.3
      branch: ${{ github.head_ref }}
    secrets: inherit
